<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="smoothieGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#98fb98"/>
      <stop offset="50%" style="stop-color:#90ee90"/>
      <stop offset="100%" style="stop-color:#7cfc00"/>
    </linearGradient>
    <radialGradient id="glassGradient" cx="30%" cy="20%" r="80%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.3"/>
      <stop offset="70%" style="stop-color:#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strawGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#ff8e8e"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#2d5016" opacity="0.1"/>
  
  <!-- Glass shadow -->
  <ellipse cx="205" cy="350" rx="60" ry="15" fill="#000000" opacity="0.2"/>
  
  <!-- Glass base -->
  <path d="M 140 320 L 260 320 L 250 340 L 150 340 Z" fill="#e6e6e6"/>
  
  <!-- Glass body -->
  <path d="M 150 340 L 250 340 L 240 120 L 160 120 Z" 
        fill="#f0f8ff" stroke="#d3d3d3" stroke-width="2" opacity="0.9"/>
  
  <!-- Smoothie -->
  <path d="M 155 335 L 245 335 L 235 140 L 165 140 Z" fill="url(#smoothieGradient)"/>
  
  <!-- Foam/bubbles on top -->
  <ellipse cx="200" cy="140" rx="35" ry="8" fill="#ffffff" opacity="0.7"/>
  <circle cx="185" cy="145" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="210" cy="142" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="195" cy="148" r="1.5" fill="#ffffff" opacity="0.4"/>
  
  <!-- Straw -->
  <rect x="220" y="80" width="8" height="180" rx="4" fill="url(#strawGradient)"/>
  <rect x="222" y="82" width="4" height="176" rx="2" fill="#ffb3b3"/>
  
  <!-- Straw bend -->
  <path d="M 224 80 Q 240 70 250 85" stroke="url(#strawGradient)" stroke-width="8" 
        fill="none" stroke-linecap="round"/>
  <path d="M 224 80 Q 240 70 250 85" stroke="#ffb3b3" stroke-width="4" 
        fill="none" stroke-linecap="round"/>
  
  <!-- Glass highlight -->
  <path d="M 160 120 L 170 120 L 175 330 L 165 330 Z" fill="url(#glassGradient)"/>
  
  <!-- Ingredients floating -->
  <!-- Spinach leaves -->
  <ellipse cx="180" cy="200" rx="8" ry="12" fill="#228b22" opacity="0.6"/>
  <ellipse cx="220" cy="250" rx="6" ry="10" fill="#228b22" opacity="0.5"/>
  
  <!-- Banana pieces -->
  <ellipse cx="190" cy="280" rx="12" ry="6" fill="#fff8dc" opacity="0.7"/>
  <ellipse cx="210" cy="220" rx="10" ry="5" fill="#fff8dc" opacity="0.6"/>
  
  <!-- Apple pieces -->
  <circle cx="200" cy="300" r="5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="185" cy="260" r="4" fill="#ff6b6b" opacity="0.4"/>
  
  <!-- Glass rim -->
  <ellipse cx="200" cy="120" rx="40" ry="8" fill="none" stroke="#d3d3d3" stroke-width="3"/>
  <ellipse cx="200" cy="118" rx="40" ry="8" fill="#ffffff" opacity="0.3"/>
</svg>