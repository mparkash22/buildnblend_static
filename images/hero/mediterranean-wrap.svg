<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tortillaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5deb3"/>
      <stop offset="50%" style="stop-color:#deb887"/>
      <stop offset="100%" style="stop-color:#d2b48c"/>
    </linearGradient>
    <radialGradient id="plateGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fa"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#2d5016" opacity="0.1"/>
  
  <!-- Plate shadow -->
  <ellipse cx="205" cy="340" rx="120" ry="20" fill="#000000" opacity="0.15"/>
  
  <!-- Plate -->
  <circle cx="200" cy="200" r="140" fill="url(#plateGradient)" stroke="#e9ecef" stroke-width="3"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Wrap base -->
  <ellipse cx="200" cy="200" rx="100" ry="40" fill="url(#tortillaGradient)"/>
  
  <!-- Wrap fold/seam -->
  <path d="M 120 180 Q 200 160 280 180 Q 200 200 120 180" 
        fill="#d2b48c" opacity="0.7"/>
  
  <!-- Lettuce showing -->
  <path d="M 130 185 Q 150 175 170 185 Q 150 195 130 185" fill="#228b22"/>
  <path d="M 230 185 Q 250 175 270 185 Q 250 195 230 185" fill="#228b22"/>
  <path d="M 180 190 Q 200 180 220 190 Q 200 200 180 190" fill="#32cd32"/>
  
  <!-- Tomatoes -->
  <circle cx="160" cy="190" r="6" fill="#dc143c"/>
  <circle cx="240" cy="190" r="5" fill="#dc143c"/>
  <circle cx="200" cy="185" r="4" fill="#ff6347"/>
  
  <!-- Cucumber -->
  <ellipse cx="175" cy="195" rx="8" ry="3" fill="#90ee90"/>
  <ellipse cx="225" cy="195" rx="6" ry="3" fill="#90ee90"/>
  
  <!-- Red onion -->
  <path d="M 190 200 Q 195 195 200 200 Q 195 205 190 200" fill="#8b008b" opacity="0.6"/>
  <path d="M 200 200 Q 205 195 210 200 Q 205 205 200 200" fill="#8b008b" opacity="0.6"/>
  
  <!-- Feta cheese -->
  <rect x="185" y="188" width="6" height="4" rx="1" fill="#f5f5dc"/>
  <rect x="205" y="192" width="5" height="3" rx="1" fill="#f5f5dc"/>
  <rect x="195" y="195" width="4" height="3" rx="1" fill="#f5f5dc"/>
  
  <!-- Olives -->
  <circle cx="170" cy="200" r="3" fill="#2f4f2f"/>
  <circle cx="230" cy="188" r="2.5" fill="#2f4f2f"/>
  
  <!-- Wrap edges/texture -->
  <path d="M 100 200 Q 120 190 140 200" fill="none" stroke="#d2b48c" stroke-width="2"/>
  <path d="M 260 200 Q 280 190 300 200" fill="none" stroke="#d2b48c" stroke-width="2"/>
  
  <!-- Plate highlight -->
  <path d="M 80 120 Q 200 100 320 120" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Garnish -->
  <circle cx="140" cy="250" r="2" fill="#228b22"/>
  <circle cx="260" cy="250" r="2" fill="#228b22"/>
  <circle cx="200" cy="270" r="1.5" fill="#dc143c"/>
  
  <!-- Wrap shadow on plate -->
  <ellipse cx="205" cy="240" rx="95" ry="15" fill="#000000" opacity="0.1"/>
</svg>