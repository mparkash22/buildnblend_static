<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bowlGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </radialGradient>
    <radialGradient id="riceGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fff8dc"/>
      <stop offset="100%" style="stop-color:#f5deb3"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#2d5016" opacity="0.1"/>
  
  <!-- Bowl base -->
  <ellipse cx="200" cy="320" rx="140" ry="25" fill="#8b4513" opacity="0.3"/>
  
  <!-- Bowl -->
  <path d="M 80 200 Q 80 280 200 300 Q 320 280 320 200 L 300 200 Q 300 260 200 275 Q 100 260 100 200 Z" 
        fill="url(#bowlGradient)" stroke="#6c757d" stroke-width="2"/>
  
  <!-- Rice base -->
  <ellipse cx="200" cy="210" rx="90" ry="15" fill="url(#riceGradient)"/>
  
  <!-- Vegetables -->
  <!-- Broccoli -->
  <circle cx="160" cy="190" r="12" fill="#228b22"/>
  <circle cx="155" cy="185" r="8" fill="#32cd32"/>
  <circle cx="165" cy="185" r="8" fill="#32cd32"/>
  
  <!-- Carrots -->
  <ellipse cx="240" cy="195" rx="8" ry="15" fill="#ff8c00"/>
  <ellipse cx="250" cy="200" rx="6" ry="12" fill="#ff8c00"/>
  
  <!-- Red peppers -->
  <circle cx="180" cy="205" r="8" fill="#dc143c"/>
  <circle cx="220" cy="185" r="6" fill="#dc143c"/>
  
  <!-- Avocado -->
  <ellipse cx="200" cy="175" rx="15" ry="10" fill="#9acd32"/>
  <ellipse cx="200" cy="175" rx="10" ry="6" fill="#adff2f"/>
  
  <!-- Protein (tofu/chicken) -->
  <rect x="185" y="200" width="12" height="8" rx="2" fill="#f5deb3"/>
  <rect x="205" y="195" width="10" height="10" rx="2" fill="#f5deb3"/>
  
  <!-- Garnish -->
  <circle cx="170" cy="175" r="2" fill="#228b22"/>
  <circle cx="230" cy="175" r="2" fill="#228b22"/>
  <circle cx="210" cy="165" r="1.5" fill="#228b22"/>
  
  <!-- Bowl rim highlight -->
  <path d="M 100 200 Q 100 190 200 190 Q 300 190 300 200" 
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
</svg>