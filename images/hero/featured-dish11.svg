<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bowlGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </radialGradient>
    <radialGradient id="riceGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fff8dc"/>
      <stop offset="100%" style="stop-color:#f5deb3"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#f8f7f2"/>
  
  <!-- Bowl shadow -->
  <ellipse cx="205" cy="320" rx="140" ry="25" fill="#000000" opacity="0.15"/>
  
  <!-- Bowl -->
  <path d="M 80 200 Q 80 280 200 300 Q 320 280 320 200 L 300 200 Q 300 260 200 275 Q 100 260 100 200 Z" 
        fill="url(#bowlGradient)" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- Rice base -->
  <ellipse cx="200" cy="210" rx="90" ry="15" fill="url(#riceGradient)"/>
  
  <!-- Colorful vegetables -->
  <!-- Red bell peppers -->
  <circle cx="160" cy="190" r="8" fill="#ff5722"/>
  <circle cx="240" cy="190" r="8" fill="#ff5722"/>
  
  <!-- Green vegetables (broccoli) -->
  <circle cx="180" cy="200" r="10" fill="#4caf50"/>
  <circle cx="220" cy="200" r="10" fill="#4caf50"/>
  
  <!-- Yellow corn -->
  <circle cx="200" cy="185" r="6" fill="#ffc107"/>
  <circle cx="190" cy="195" r="4" fill="#ffc107"/>
  <circle cx="210" cy="195" r="4" fill="#ffc107"/>
  
  <!-- Purple cabbage -->
  <circle cx="170" cy="210" r="7" fill="#9c27b0"/>
  <circle cx="230" cy="210" r="7" fill="#9c27b0"/>
  
  <!-- Orange carrots -->
  <ellipse cx="185" cy="220" rx="6" ry="10" fill="#ff9800"/>
  <ellipse cx="215" cy="220" rx="6" ry="10" fill="#ff9800"/>
  
  <!-- Avocado -->
  <ellipse cx="200" cy="175" rx="12" ry="8" fill="#4caf50"/>
  <ellipse cx="200" cy="175" rx="8" ry="5" fill="#8bc34a"/>
  
  <!-- Black beans -->
  <circle cx="150" cy="205" r="4" fill="#3e2723"/>
  <circle cx="250" cy="205" r="4" fill="#3e2723"/>
  <circle cx="200" cy="200" r="3" fill="#3e2723"/>
  
  <!-- Fresh cilantro garnish -->
  <circle cx="180" cy="170" r="3" fill="#2e7d32"/>
  <circle cx="220" cy="170" r="3" fill="#2e7d32"/>
  <circle cx="200" cy="165" r="2" fill="#2e7d32"/>
  
  <!-- Bowl rim highlight -->
  <path d="M 100 200 Q 100 190 200 190 Q 300 190 300 200" 
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Lime wedge -->
  <path d="M 160 160 Q 170 150 180 160 Q 170 170 160 160" fill="#8bc34a"/>
  
  <!-- Sour cream dollop -->
  <ellipse cx="240" cy="180" rx="8" ry="6" fill="#ffffff"/>
</svg>